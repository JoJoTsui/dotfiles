name: Native Windows deployment
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        role: [workstation, remote-compute]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
      - name: Native PowerShell and Windows runtime acceptance
        shell: powershell
        run: ./tests/native/windows.ps1 -Role '${{ matrix.role }}' -ReportDirectory "$env:RUNNER_TEMP/dotfiles-windows-reports"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.role }}
          path: ${{ runner.temp }}/dotfiles-windows-reports
          if-no-files-found: warn

  # Optional bundle execution. The matrix above installs common defaults only, so
  # bundle selection needs its own native slot; the workstation role represents
  # it, and remote compute is not claimed by it.
  desktop:
    name: windows bundle desktop
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
      - name: Native PowerShell and Windows bundle acceptance
        shell: powershell
        run: ./tests/native/windows.ps1 -Role workstation -Bundles desktop -ReportDirectory "$env:RUNNER_TEMP/dotfiles-windows-reports"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop
          path: ${{ runner.temp }}/dotfiles-windows-reports
          if-no-files-found: warn
