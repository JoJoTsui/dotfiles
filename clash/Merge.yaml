# Profile Enhancement Merge Template for Clash Verge
#
# Reference copy of the live global extend config:
#   ~/Library/Application Support/io.github.clash-verge-rev.clash-verge-rev/profiles/Merge.yaml
# `clash/` is chezmoi-ignored, so this file is never applied to $HOME. Change the
# live copy through the app (全局扩展配置) and copy it back here.
#
# Merge semantics, verified against the generated runtime config:
#   dns:            deep-merges into the subscription's dns block
#   rules:          REPLACES the subscription's rule list
#   rule-providers: the Loyalsoldier sets below refresh every 86400s from GitHub
# Personal rules belong in the per-profile rules enhancement
# (profiles/<uid>.yaml, `prepend:`), which adds instead of replacing.

profile:
  store-selected: true

dns:
  use-system-hosts: false

  # ===== 个人 DNS 覆写开始（Personal DNS Override）=====
  # aihot.news 被国内 DNS 解析到失效的 EdgeOne 国内节点
  # （180.178.227.7 / 36.25.245.118 / 119.96.17.181：TCP 通，但 TLS/HTTP 无响应），
  # 强制改用境外解析器，拿到可用的境外节点（43.159.99.102 / 43.159.98.107）。
  nameserver-policy:
    "aihot.news":
      - "https://dns.google/dns-query#PROXY"
      - "https://cloudflare-dns.com/dns-query#PROXY"
    "+.aihot.news":
      - "https://dns.google/dns-query#PROXY"
      - "https://cloudflare-dns.com/dns-query#PROXY"

  # 别的域名也要走境外 DNS，照这个格式往下加：
  # "example.com":
  #   - "https://dns.google/dns-query#PROXY"
  # ===== 个人 DNS 覆写结束 =====

rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  icloud:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400

  apple:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400

  google:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400

  gfw:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: ./ruleset/gfw.yaml
    interval: 86400

  tld-not-cn:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt"
    path: ./ruleset/tld-not-cn.yaml
    interval: 86400

  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400

  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400

rules:
  # ===== 个人自定义规则开始（Personal Rules）=====
  # AIHOT：走代理（配合上面的 nameserver-policy，才会拿到境外 CDN 节点）
  - "DOMAIN-SUFFIX,aihot.news,PROXY"

  # 新增自定义规则写在这下面。可用的代理组：
  #   PROXY     → 主代理组（跟 RULE-SET,google/gfw 一致）
  #   🚀节点选择 → 手动选节点
  #   🤖AI网站  → AI 类站点专用组
  # - "DOMAIN-SUFFIX,example.com,PROXY"
  # - "DOMAIN-SUFFIX,another.com,🤖AI网站"
  # ===== 个人自定义规则结束 =====

  # Custom IP rules (highest priority)
  - "IP-CIDR,34.102.215.99/32,PROXY"
  # Private-range host that must stay off the proxy. RULE-SET,private is a
  # domain set, so it cannot match an address; this entry is the only cover.
  - "IP-CIDR,10.31.3.142/32,DIRECT"

  # Local applications
  - "RULE-SET,applications,DIRECT"

  # Dashboard domains
  - "DOMAIN,clash.razord.top,DIRECT"
  - "DOMAIN,yacd.haishan.me,DIRECT"

  # Private networks
  - "RULE-SET,private,DIRECT"

  # Ad blocking
  - "RULE-SET,reject,REJECT"

  # Apple services
  - "RULE-SET,icloud,DIRECT"
  - "RULE-SET,apple,DIRECT"

  # Proxy rules (Google, GFW, etc.)
  - "RULE-SET,google,PROXY"
  - "RULE-SET,gfw,PROXY"
  - "RULE-SET,tld-not-cn,PROXY"
  - "RULE-SET,telegramcidr,PROXY"
  - "RULE-SET,proxy,PROXY"

  # Direct rules (China)
  - "RULE-SET,direct,DIRECT"
  - "RULE-SET,lancidr,DIRECT"
  - "RULE-SET,cncidr,DIRECT"
  - "GEOIP,LAN,DIRECT"
  - "GEOIP,CN,DIRECT"

  # Default
  - "MATCH,DIRECT"
