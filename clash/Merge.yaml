# Profile Enhancement Merge Template for Clash Verge
#
# Reference copy of the live global extend config:
#   ~/Library/Application Support/io.github.clash-verge-rev.clash-verge-rev/profiles/Merge.yaml
# `clash/` is chezmoi-ignored, so this file is never applied to $HOME. Change the
# live copy through the app (全局扩展配置) and copy it back here.
#
# Merge semantics, verified against the generated runtime config:
#   dns:            deep-merges into the subscription's dns block
#   rules:          REPLACES the subscription's rule list
#   rule-providers: the Loyalsoldier sets below refresh every 86400s from GitHub
#
# This file therefore has no rules: key. A replacement here also discards the
# prepended personal rules, so the whole policy lives in the per-profile rules
# enhancement (clash/rules-enhancement.yaml), which adds instead of replacing
# and leaves the subscription's own rules in force.

profile:
  store-selected: true

dns:
  use-system-hosts: false

  # Mainland EdgeOne edges for aihot.news accept TCP and then stall the TLS
  # handshake (180.178.227.7, 36.25.245.118, 119.96.17.181); overseas resolvers
  # return edges that serve (43.159.99.102, 43.159.98.107). Removing this block
  # while keeping the DOMAIN-SUFFIX rule reproduces a 5 s timeout, so it is
  # load-bearing, not decoration.
  #
  # `+.aihot.news` is not a duplicate of the bare key: www.aihot.news exists and
  # 301s to the apex, and it needs the same overseas answer.
  nameserver-policy:
    "aihot.news":
      - "https://dns.google/dns-query#PROXY"
      - "https://cloudflare-dns.com/dns-query#PROXY"
    "+.aihot.news":
      - "https://dns.google/dns-query#PROXY"
      - "https://cloudflare-dns.com/dns-query#PROXY"

  # 别的域名也要走境外 DNS，照这个格式往下加：
  # "example.com":
  #   - "https://dns.google/dns-query#PROXY"
  # ===== 个人 DNS 覆写结束 =====

rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  icloud:
