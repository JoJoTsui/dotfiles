# One shared value model. Adapters contain shell syntax, not copied defaults.
[sharedShell]
umask = "0022"
pythonPreference = "managed"
defaults = [
  { name = "JOEY", base = "HOME", suffix = "joey" },
  { name = "GIZMO", base = "JOEY", suffix = "gizmo" },
  { name = "BIO_GIZMO", base = "JOEY", suffix = "bio_gizmo" },
  { name = "NUSHELL_PATH", base = "GIZMO", suffix = "nushell" },
  { name = "JSHELL", base = "JOEY", suffix = "SHELL" },
  { name = "XDG_CONFIG_HOME", base = "HOME", suffix = ".config" },
  { name = "XDG_DATA_HOME", base = "HOME", suffix = ".local/share" },
  { name = "XDG_STATE_HOME", base = "HOME", suffix = ".local/state" },
  { name = "XDG_CACHE_HOME", base = "HOME", suffix = ".cache" },
  { name = "ATUIN_CONFIG_DIR", base = "XDG_CONFIG_HOME", suffix = "atuin" },
  { name = "ATUIN_DATA_DIR", base = "XDG_DATA_HOME", suffix = "atuin" },
  { name = "_ZO_DATA_DIR", base = "XDG_DATA_HOME", suffix = "zoxide" },
  { name = "PIXI_HOME", base = "HOME", suffix = ".pixi" },
  { name = "BUN_INSTALL", base = "HOME", suffix = ".bun" },
  { name = "CARGO_HOME", base = "HOME", suffix = ".cargo" },
  { name = "RUSTUP_HOME", base = "HOME", suffix = ".rustup" },
  { name = "MAMBA_EXE", base = "PIXI_HOME", suffix = "bin/micromamba", windowsSuffix = "bin/micromamba.exe" },
  { name = "MAMBA_ROOT_PREFIX", base = "XDG_DATA_HOME", suffix = "micromamba" },
  { name = "EDITOR", value = "hx" },
  { name = "UV_PYTHON_PREFERENCE", setting = "pythonPreference" },
  { name = "PIP_INDEX_URL", mirror = "pythonIndex" },
  { name = "UV_DEFAULT_INDEX", mirror = "pythonIndex" },
  { name = "RUSTUP_UPDATE_ROOT", mirror = "rustupUpdateRoot" },
  { name = "RUSTUP_DIST_SERVER", mirror = "rustupDistServer" },
  { name = "CHOKIDAR_USEPOLLING", value = "0", remote = "1" },
  { name = "LESSCHARSET", value = "utf-8" },
  { name = "PAGER", value = "less" },
  { name = "TAILSPIN_PAGER", value = "less -R [FILE]" },
]
windowsDefaults = [
  { name = "APPDATA", base = "HOME", suffix = "AppData/Roaming" },
  { name = "LOCALAPPDATA", base = "HOME", suffix = "AppData/Local" },
  { name = "KIMI_SHELL_PATH", base = "XDG_DATA_HOME", suffix = "dotfiles/git-bash/bin/bash.exe" },
  { name = "CLAUDE_CODE_GIT_BASH_PATH", base = "XDG_DATA_HOME", suffix = "dotfiles/git-bash/bin/bash.exe" },
  { name = "HELIX_RUNTIME", base = "XDG_DATA_HOME", suffix = "dotfiles/helix/runtime" },
]
# The first directory wins. Compatibility tool directories are never added.
paths = [
  { base = "BUN_INSTALL", suffix = "bin" },
  { base = "HOME", suffix = ".local/bin" },
  { base = "PIXI_HOME", suffix = "bin" },
  { base = "CARGO_HOME", suffix = "bin" },
]
windowsPaths = [
  { base = "XDG_DATA_HOME", suffix = "dotfiles/git-bash/bin" },
]

[mirrors.tuna]
pythonIndex = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
cargoIndex = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
rustupUpdateRoot = "https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup"
rustupDistServer = "https://mirrors.tuna.tsinghua.edu.cn/rustup"
condaChannelAlias = "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud"
condaChannels = ["https://conda.anaconda.org/nvidia/", "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/pytorch/", "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/", "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/bioconda/", "https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/"]

[mirrors.upstream]
pythonIndex = "https://pypi.org/simple"
rustupUpdateRoot = "https://static.rust-lang.org/rustup"
rustupDistServer = "https://static.rust-lang.org"
condaChannelAlias = "https://conda.anaconda.org"
condaChannels = ["nvidia", "pytorch", "conda-forge", "bioconda", "https://repo.anaconda.com/pkgs/main/"]
