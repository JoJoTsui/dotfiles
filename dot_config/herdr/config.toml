onboarding = false
[theme]
name = "catppuccin"
auto_switch = false
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[terminal]
default_shell = "nu"

# Keep task checkouts on the device's persistent home. Legacy hosts link
# ~/.herdr into the live tree; see docs/HERDR.md.
[worktrees]
directory = "~/.herdr/worktrees"
